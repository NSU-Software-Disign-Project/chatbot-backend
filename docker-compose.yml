version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network
    restart: always

  backend:
    build: .
    container_name: backend
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=mongodb://mongodb:27017/expressRestDB?replicaSet=rs0&directConnection=true&connectTimeoutMS=5000
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ../chatbot-frontend
    container_name: frontend
    environment:
      - REACT_APP_ENV=${NODE_ENV:-development}
      - REACT_APP_BACKEND_URL=${BACKEND_URL:-https://localhost}
      - REACT_APP_YJS_WS_URL=${YJS_WS_URL:-wss://chatbot-editor.ddns.net/yjs}
    networks:
      - app-network
    restart: always

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./init.js:/docker-entrypoint-initdb.d/init.js:ro
    command: [ "mongod", "--replSet", "rs0" ]
    networks:
      - app-network
    restart: always

  yjs-websocket:
    image: node:18-alpine
    container_name: yjs-websocket
    command: sh -c "npm install @y/websocket-server --omit=dev && npx y-websocket --port 1234"
    volumes:
      - yjs-websocket-node-modules:/app/node_modules
    working_dir: /app
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
  caddy-data:
  caddy-config:
  yjs-websocket-node-modules:
